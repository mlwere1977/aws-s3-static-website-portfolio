name: Deploy Static Website to AWS S3

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Static Files to AWS S3
        run: |
          aws s3 sync website/ s3://${{ secrets.S3_BUCKET_NAME }} --delete \
            --exclude "*.mov" \
            --exclude "*.mp4"

      - name: Sync Media Files with Proper MIME Types
        run: |
          aws s3 cp website/Mukwaya_Lwere_Professional_Intro_AWS.mp4 s3://${{ secrets.S3_BUCKET_NAME }}/Mukwaya_Lwere_Professional_Intro_AWS.mp4 \
            --content-type "video/mp4" || true
